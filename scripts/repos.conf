# repos.conf — декларативный реестр репозиториев workspace (единственный источник правды
# слоя синхронизации; ноль хардкода имён реп в логике). ГЛАВНЫЙ ПАРАМЕТР ШАБЛОНА.
#
# Формат (bash 3.2-парсабельный), поля через '|', пробелы вокруг обрезаются:
#
#   имя | тип | путь | базовая-ветка | путь-основного-worktree | [доп-worktree] | [origin-URL]
#
#   тип:  bare  — bare-репозиторий в .repos/<имя>.git + отдельные worktree (клиентская
#                 двухконтурная модель M1: код клиента живёт ВНУТРИ workspace, чистые
#                 коммиты уходят через deliver.sh; bootstrap.sh ставит pushurl=DISABLED)
#         plain — обычный клон (read-only), worktree == сам клон
#   путь: относительно корня workspace (для bare — путь к .git, для plain — к клону)
#   путь-основного-worktree: относительно корня workspace (для plain дублирует путь)
#   доп-worktree (опц., поле 6): дополнительные основные worktree того же bare-репо,
#         формат "имя:ветка" (через запятую). sync.sh делает им ff-only как основному.
#         Пример: prod-worktree указывает на ветку релиза/прода. Пусто — оставить поле пустым.
#   origin-URL (опц., поле 7): полный git-клонируемый URL репы (на github.com/d-s-vo/nuxt4-ts-project-cbook).
#         bootstrap.sh по нему делает `git clone --bare` в .repos/ и создаёт основные worktree,
#         если каталога ещё нет. Пусто → bootstrap не клонирует (репа уже на месте / внутренний
#         одно-репный сценарий). Отсутствие origin при отсутствии каталога — ЯВНАЯ ошибка bootstrap
#         (или пропуск флагом --skip-missing).
#
# ЗАПОЛНИТЕ под свой проект. Ниже — закомментированные примеры-образцы; раскомментируйте и
# отредактируйте (имена/ветки/пути — ваши). Заглушка {{...}} обязана быть заменена.
#
# name              | type  | path                       | base                     | main_worktree     | extra-worktree | origin-URL
# --- ОБЯЗАТЕЛЬНАЯ строка (замените плейсхолдеры на реальные значения): ---
cbook  | bare  | .repos/cbook.git | develop | cbook | prod:main | https://github.com/d-s-vo/nuxt4-ts-project-cbook
#
# --- Пример клиентской bare-репы с доп. prod-worktree (двухконтурная модель M1): ---
# app                 | bare  | .repos/app.git             | develop                  | app               | prod:release   | ssh://git@git.example.com:22/team/app.git
#
# --- Пример read-only справочного клона (не bare, worktree = сам клон): ---
# shared-lib          | plain | shared-lib                 | main                     | shared-lib        |                | https://git.example.com/team/shared-lib.git
#
# --- ВНУТРЕННИЙ одно-репный сценарий (M1 «контуры совпадают»): единственная строка,
#     тип bare без клиентского origin; deliver.sh не используется, push через ai-push.sh/человека.
#     origin можно оставить пустым, если репо уже инициализирован на месте. ---
# myproject           | bare  | .repos/myproject.git       | main                     | myproject         |                |
